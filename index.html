<!doctype html>
<html lang="sk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slovíčka</title>
  <meta name="description" content="Slovíčka — učenie slovenčiny s intervalovým opakovaním">
  <meta name="theme-color" content="#13110e">
  <meta name="color-scheme" content="dark light">
  <!-- iOS: запуск с экрана «Домой» как отдельное приложение -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slovíčka">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin-ext-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <script>
    // Тема и CRT применяются до отрисовки, чтобы не было вспышки светлого фона.
    try {
      const s = JSON.parse(localStorage.getItem('slovicka.ui') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
      if (s.crt === false) document.documentElement.classList.add('crt-off');
    } catch (e) { /* приватный режим — игнорируем */ }
  </script>
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav id="tabbar" aria-label="Navigácia"></nav>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:24px">Slovíčka potrebujú JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
